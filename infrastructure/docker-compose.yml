services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    command:
      - --config-body
      - |
        port: 7880
        keys:
          "${LIVEKIT_API_KEY}": "${LIVEKIT_API_SECRET}"
        rtc:
          tcp_port: 7881
          udp_port: 7882
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks:
      - chat-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: community_chat_db
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d community_chat_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chat-network

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: community_chat_db
      PGUSER: chat_user
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in your environment}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in your environment}
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - chat-network

volumes:
  postgres_data:

networks:
  chat-network:
    driver: bridge
